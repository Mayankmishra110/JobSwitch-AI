services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: jobswitch
      POSTGRES_PASSWORD: devpassword
      POSTGRES_DB: jobswitch_dev
    ports:
      - '5432:5432'
    volumes:
      - jobswitch_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U jobswitch -d jobswitch_dev']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  jobswitch_pgdata:
