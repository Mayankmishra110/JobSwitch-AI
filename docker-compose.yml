services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: jobswitch
      POSTGRES_PASSWORD: devpassword
      POSTGRES_DB: jobswitch_dev
    ports:
      - '5432:5432'
    volumes:
      - jobswitch_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U jobswitch -d jobswitch_dev']
      interval: 5s
      timeout: 5s
      retries: 10

  # D-26: event bus for fan-out (one fact, multiple independent consumers)
  # and cross-service/cross-language handoff - job_queue stays for
  # same-language, single-consumer task claiming; this is for everything
  # job_queue's claim semantics don't fit. Single-replica StatefulSet in
  # k8s (jobswitch-data namespace); a plain container + volume locally.
  nats:
    image: nats:2-alpine
    command: ['-js', '-sd', '/data', '-m', '8222']
    ports:
      - '4222:4222' # client connections
      - '8222:8222' # HTTP monitoring (/varz, /jsz)
    volumes:
      - jobswitch_natsdata:/data
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:8222/healthz || exit 1']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  jobswitch_pgdata:
  jobswitch_natsdata:
